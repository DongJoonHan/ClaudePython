[project]
name = "childlock"
version = "0.1.0"
description = "전자식 차일드락 제어 SW (PC/SIL 참조 구현)"
requires-python = ">=3.12,<3.13"
# 런타임 의존성 없음 (표준 라이브러리만 사용). 개발 도구는 requirements-dev.txt
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src", "tools"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.ruff]
line-length = 80
target-version = "py312"
extend-exclude = [".claude", "OEM"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import 정렬, N: Google 명명 규칙(pep8-naming),
# B: bugbear, C90: 순환복잡도, UP: 최신 문법, SIM: 단순화
# D(pydocstyle)는 Doxygen 주석 스타일과 충돌하므로 사용하지 않는다.
select = ["E", "W", "F", "I", "N", "B", "C90", "UP", "SIM"]

[tool.ruff.lint.mccabe]
max-complexity = 10

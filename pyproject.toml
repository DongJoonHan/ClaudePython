[project]
name = "childlock"
version = "0.1.0"
description = "전자식 차일드락 제어 SW (PC/SIL 참조 구현)"
requires-python = ">=3.12,<3.13"
# 런타임 의존성 없음 (표준 라이브러리만 사용). 개발 도구는 requirements-dev.txt
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src", "tools"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.ruff]
line-length = 80
target-version = "py312"
extend-exclude = [".claude", "OEM"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import 정렬, N: Google 명명 규칙(pep8-naming),
# B: bugbear, C90: 순환복잡도, UP: 최신 문법, SIM: 단순화,
# ANN: 타입 표기, S: 보안, BLE: 예외 전체 삼킴, PLW: global 등, TID: 금지 API,
# RUF: Ruff 전용 규칙 (SAP-ECL-001 4절)
# D(pydocstyle)는 Doxygen 주석 스타일과 충돌하므로 사용하지 않는다.
select = [
    "E", "W", "F", "I", "N", "B", "C90", "UP", "SIM",
    "ANN", "S", "BLE", "PLW", "TID", "RUF",
]

[tool.ruff.lint.per-file-ignores]
# 테스트: assert 사용(S101), 테스트 함수 타입 표기(ANN), 서버를 띄우기 위한
# threading 사용(TID251) 허용. 제품 코드(src)에는 적용하지 않는다.
"tests/**" = ["S101", "ANN", "TID251"]

[tool.ruff.lint.pep8-naming]
# http.server가 정한 메서드 이름 (BaseHTTPRequestHandler 재정의)
extend-ignore-names = ["do_GET", "do_POST"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# SAP-ECL-001 PS-02: 결정론·단일 스레드·외부 영향 차단
"time".msg = "결정론 위반: 시각은 now_s 인자로만 받는다 (AP-02)"
"random".msg = "결정론 위반 (AP-02)"
"threading".msg = "단일 스레드 원칙 위반 (AD-03)"
"asyncio".msg = "단일 스레드 원칙 위반 (AD-03)"
"multiprocessing".msg = "단일 스레드 원칙 위반 (AD-03)"
"subprocess".msg = "외부 프로세스 실행 금지 (PS-02)"
"pickle".msg = "역직렬화 금지 (PS-02)"
"os".msg = "외부 환경 의존 금지 (PS-02)"

[tool.mypy]
strict = true
disallow_any_explicit = true
warn_unreachable = true
files = ["src", "tools"]
python_version = "3.12"

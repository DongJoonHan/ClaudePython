<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차일드락 시뮬레이터</title>
<style>
  :root { --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --line: #d9d9d4; --accent: #2f5d8a; --warn: #a3412c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1c1e; --fg: #ececea; --muted: #9a9a95; --line: #3a3b3e; --accent: #7fb0e0; --warn: #e48a76; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.note { color: var(--muted); margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  fieldset { border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
  label { display: flex; justify-content: space-between; gap: 8px; margin: 4px 0; }
  input[type=number], select { width: 9em; }
  button { margin: 4px 4px 0 0; padding: 6px 12px; border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 4px; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  td, th { border-bottom: 1px solid var(--line); padding: 3px 6px; text-align: left; }
  .lock { color: var(--warn); font-weight: 600; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<h1>전자식 차일드락 PC/SIL 시뮬레이터</h1>
<p class="note">입력 편의용 화면입니다. 시험 합격 판정은 /api/status, /api/events 응답으로 합니다 (SWA-ECL-001 4.1).</p>
<div class="grid">
  <fieldset>
    <legend>차량 입력</legend>
    <label>차속 (km/h) <input id="vehicle_speed_kph" type="number" value="0" step="0.1"></label>
    <label>기어 <select id="gear"><option>P</option><option>N</option><option>D</option><option>R</option></select></label>
    <label>충돌 상태 <select id="crash_status"><option>NONE</option><option>PENDING</option><option>CONFIRMED</option></select></label>
    <label>시동 ON <input id="ignition_on" type="checkbox" checked></label>
    <label>센서 고장 <input id="sensor_fault" type="checkbox"></label>
    <label>좌 접근위험 <input id="rear_left_approach_risk" type="checkbox"></label>
    <label>우 접근위험 <input id="rear_right_approach_risk" type="checkbox"></label>
    <label>화재 <input id="fire_detected" type="checkbox"></label>
    <label>과온 <input id="overtemperature_detected" type="checkbox"></label>
    <label>성인 탑승 <input id="adult_present" type="checkbox"></label>
    <label>좌 ISOFIX <input id="isofix_left" type="checkbox"></label>
    <label>우 ISOFIX <input id="isofix_right" type="checkbox"></label>
  </fieldset>
  <fieldset>
    <legend>운전자 명령 (한 틱에만 전송)</legend>
    <label>대상 <select id="cmd_side"><option value="">없음</option><option>left</option><option>right</option><option>all</option></select></label>
    <label>동작 <select id="cmd_action"><option>lock</option><option>unlock</option></select></label>
    <label>경로 <select id="cmd_source"><option>physical_button</option><option>avn</option><option>voice</option><option>mobile_app</option></select></label>
    <div>
      <button id="send">틱 보내기 (+10 ms)</button>
      <button id="auto">자동 진행 시작</button>
      <button id="quiet">입력 없이 틱</button>
    </div>
    <p class="note" id="clock">now_s = 0.00</p>
  </fieldset>
  <fieldset>
    <legend>현재 출력</legend>
    <div class="scroll"><table id="status"></table></div>
  </fieldset>
</div>
<fieldset style="margin-top:16px">
  <legend>최근 결정 기록</legend>
  <div class="scroll"><table id="events"></table></div>
</fieldset>
<script>
  // 시각은 정수 틱 카운터로 관리한다: now_s = n / 100, timestamp_s = now_s (SWD 10장)
  let n = 0;
  let timer = null;
  const BOOLS = ["ignition_on", "sensor_fault", "rear_left_approach_risk", "rear_right_approach_risk",
                 "fire_detected", "overtemperature_detected", "adult_present", "isofix_left", "isofix_right"];

  function snapshot(nowS, withCommand) {
    const s = { timestamp_s: nowS, vehicle_speed_kph: Number(document.getElementById("vehicle_speed_kph").value),
                gear: document.getElementById("gear").value, crash_status: document.getElementById("crash_status").value };
    for (const k of BOOLS) s[k] = document.getElementById(k).checked;
    const side = document.getElementById("cmd_side").value;
    if (withCommand && side) {
      s.driver_command = { side, action: document.getElementById("cmd_action").value,
                           source: document.getElementById("cmd_source").value };
      document.getElementById("cmd_side").value = "";  // 명령은 한 번만 보낸다 (DR-08)
    }
    return s;
  }

  async function tick(withSnapshot, withCommand) {
    n += 1;
    const nowS = n / 100;
    document.getElementById("clock").textContent = "now_s = " + nowS.toFixed(2);
    const body = withSnapshot ? { now_s: nowS, snapshot: snapshot(nowS, withCommand) } : { now_s: nowS };
    const r = await fetch("/api/tick", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) { document.getElementById("clock").textContent += " (HTTP " + r.status + ")"; return; }
    renderStatus(await r.json());
    renderEvents(await (await fetch("/api/events")).json());
  }

  function cell(v) {
    const td = document.createElement("td");
    td.textContent = String(v);
    if (v === "LOCK") td.className = "lock";
    return td;
  }

  function renderStatus(s) {
    const t = document.getElementById("status");
    t.replaceChildren();
    for (const [k, v] of Object.entries(s)) {
      const tr = document.createElement("tr");
      const th = document.createElement("th");
      th.textContent = k;
      tr.append(th, cell(v));
      t.append(tr);
    }
  }

  function renderEvents(list) {
    const t = document.getElementById("events");
    t.replaceChildren();
    if (!list.length) return;
    const head = document.createElement("tr");
    for (const k of Object.keys(list[0])) { const th = document.createElement("th"); th.textContent = k; head.append(th); }
    t.append(head);
    for (const e of list.slice(-20).reverse()) {
      const tr = document.createElement("tr");
      for (const v of Object.values(e)) tr.append(cell(v));
      t.append(tr);
    }
  }

  document.getElementById("send").onclick = () => tick(true, true);
  document.getElementById("quiet").onclick = () => tick(false, false);
  document.getElementById("auto").onclick = (ev) => {
    if (timer) { clearInterval(timer); timer = null; ev.target.textContent = "자동 진행 시작"; return; }
    timer = setInterval(() => tick(true, false), 100);  // 자동 진행은 명령 없이 보낸다
    ev.target.textContent = "자동 진행 멈춤";
  };
  fetch("/api/status").then((r) => r.json()).then(renderStatus);
</script>
</body>
</html>
